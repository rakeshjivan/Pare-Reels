name: Build Pare Reels

on:
  push:
    branches: [main]    # every change to main builds and publishes a release
  workflow_dispatch:    # or click "Run workflow" on the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: UNIVERSAL=1 bash build.sh
      - name: Zip
        run: ditto -c -k --keepParent "Pare Reels.app" Pare-Reels-mac.zip
      - name: Keep build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pare-Reels-mac
          path: Pare-Reels-mac.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pare Reels (build ${{ github.run_number }})
          files: Pare-Reels-mac.zip
          make_latest: true
          generate_release_notes: true
